name: PR_Gatekeeper

on: 
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
    system_info:
        runs-on: ubuntu-latest
        steps:
            - name: checks
              run: |
                echo "${{ github.base_ref }}"
                echo "${{ github.event.number }}"
                echo "Gatekeeper checks complete"

