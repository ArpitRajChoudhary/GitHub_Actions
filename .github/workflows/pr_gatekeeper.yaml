name: PR_Gatekeeper

on: 
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: checking
              run: |
                echo "${{ github.base_ref }}"
                echo "${{ github.event.number }}"
                echo "Gatekeeper checks complete"

